# WSL : heap raisonnable + Metaspace plus large (évite crash daemon après plusieurs builds)
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# WSL : évite « Already watching path » et crash du daemon
org.gradle.vfs.watch=false
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.daemon=true
android.useAndroidX=true
# AGP 9.1 recommande max 36 ; permission_handler_android exige 37.
android.suppressUnsupportedCompileSdk=37
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
